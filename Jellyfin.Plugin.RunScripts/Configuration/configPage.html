<div
    id="RunScriptsConfigPage"
    data-role="page"
    class="page type-interior pluginConfigurationPage"
    data-require="emby-input,emby-button,emby-select,emby-checkbox"
    data-controller="__plugin/runscriptsjs"
>
    <div data-role="content">
        <div class="content-primary">
            <form id="RunScriptsConfigForm">
                <div class="selectContainer">
                    <label class="selectLabel" for="user">Configure RunScripts for:</label>
                    <select is="emby-select" id="user" name="user" class="emby-select-withcolor emby-select"></select>
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="playbackstart">Event PlaybackStart</label>
                    <input id="playbackstart" name="playbackstart" type="text" is="emby-input" />
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="playbackstopped">Event PlaybackStopped</label>
                    <input id="playbackstopped" name="playbackstopped" type="text" is="emby-input" />
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input id="chkUseStdin" name="chkUseStdin" type="checkbox" is="emby-checkbox" />
                        <span>Send JSON through STDIN instead of the environment variable EVENT_ARGS.</span>
                    </label>
                    <div class="fieldDescription">
                        Some media files (especially movies) can have a lot of metadata which can cause the JSON string
                        length to exceed the system limit for environment variables. Using this option and reading the
                        JSON string through STDIN is recommended.
                    </div>
                </div>

                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
